version: "3.9"

# Phase 1 Functional Correctness tests — parameterized via P1_SCENARIO env var.
# Usage:
#   P1_SCENARIO=p1-003 docker compose -f testing/docker-compose.phase1.yml up --build
#
# Environment variables:
#   P1_SCENARIO          — which test to run (p1-002 through p1-013)
#   SENDER_DELAY_S       — extra seconds sender sleeps before sending (default 0)
#   RECEIVER_BIND_DELAY_S — seconds receiver sleeps before binding UDP socket (default 0)
#   EXPECTED_FAIL        — set to "1" for P1-012 (known-fail scenario)

networks:
  udpix-lan:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.1.0/24

volumes:
  testdata: {}
  received: {}

services:

  # ── Receiver (172.28.1.10) ───────────────────────────────────────────────────
  receiver:
    build:
      context: ..
      dockerfile: testing/Dockerfile.test
    entrypoint: /scripts/entrypoint-receiver-p1.sh
    networks:
      udpix-lan:
        ipv4_address: 172.28.1.10
    volumes:
      - testdata:/testdata
      - received:/received
    environment:
      - P1_SCENARIO=${P1_SCENARIO:-p1-002}
      - RECEIVER_BIND_DELAY_S=${RECEIVER_BIND_DELAY_S:-0}
      - EXPECTED_FAIL=${EXPECTED_FAIL:-0}
    security_opt:
      - seccomp:unconfined
    ulimits:
      memlock: -1

  # ── Sender (172.28.1.20) ─────────────────────────────────────────────────────
  sender:
    build:
      context: ..
      dockerfile: testing/Dockerfile.test
    entrypoint: /scripts/entrypoint-sender-p1.sh
    networks:
      udpix-lan:
        ipv4_address: 172.28.1.20
    volumes:
      - testdata:/testdata
      - received:/received
    environment:
      - P1_SCENARIO=${P1_SCENARIO:-p1-002}
      - SENDER_DELAY_S=${SENDER_DELAY_S:-0}
    security_opt:
      - seccomp:unconfined
    ulimits:
      memlock: -1
    depends_on:
      receiver:
        condition: service_started
